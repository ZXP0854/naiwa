  <h1>校&nbsp;歌</h1>

  <div class="lyrics">
    <div class="verse">
      东海之滨 晨曦初上<br />
      奶蛙学子 齐聚一堂<br />
      兼容并蓄 百脉汇流芳<br />
      求真求实 书声琅琅
    </div>
    <div class="verse">
      啊 奶蛙大学 同心向远方<br />
      蛙行致远 胸怀敞亮<br />
      新歌嘹亮 万里启新航<br />
      奶润初心 岁月悠长
    </div>
    <div class="verse">
      实验室里 灯火未央<br />
      绿茵场上 青春飞扬<br />
      博学笃行 蛙声满庭芳<br />
      明日栋梁 从这里启航
    </div>
