# Render 蓝图：Java Servlet + JDBC 版（Docker 运行时）
# 在 Render 控制台 New → Blueprint 选择本仓库即可按此文件创建服务
# 未配置 MySQL 时自动使用内置 H2，开箱即可运行
services:
  - type: web
    name: naiwa-java
    runtime: docker
    dockerfilePath: ./Dockerfile.java
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: NAIWA_DB_ENGINE
        value: h2
      - key: NAIWA_H2_PATH
        value: /tmp/naiwa
      # 如需改用云端 MySQL，删除上面的 NAIWA_DB_ENGINE，并补充以下变量：
      # - key: NAIWA_DB_HOST
      #   sync: false
      # - key: NAIWA_DB_PORT
      #   value: "3306"
      # - key: NAIWA_DB_USER
      #   sync: false
      # - key: NAIWA_DB_PASSWORD
      #   sync: false
      # - key: NAIWA_DB_NAME
      #   sync: false
